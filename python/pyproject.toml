[project]
name = "parabank-qa-ai"
version = "0.1.0"
description = "AI-assisted QA automation for the ParaBank demo application"
requires-python = ">=3.11"

dependencies = [
    "playwright>=1.60.0",
    "pytest>=8.2.0",
    "allure-pytest>=2.13.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "openai>=2.41.1",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
    "mypy>=1.10.0",
    "pytest-randomly>=3.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ai_demo tests fail or skip by design; run them explicitly with `pytest -m ai_demo`
addopts = '--alluredir=allure-results -m "not ai_demo"'
markers = [
    "smoke: critical path tests",
    "api: API-level tests",
    "ui: UI-level tests",
    "security: authentication/authorization tests",
    "ai_demo: intentionally failing/healing tests that showcase the AI features",
    "unit: pure-Python tests with no browser/server/network dependency",
    "defect_proof: asserts a defect's CURRENT broken behavior; delete when the defect is fixed",
]

[tool.setuptools.packages.find]
include = ["ai*", "pages*", "utils*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
# Third-party libs (allure, playwright, openai, httpx) ship partial or no stubs;
# the value here is checking our own annotations, not theirs.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
files = ["ai", "pages", "utils", "tests", "conftest.py"]
