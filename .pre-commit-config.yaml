# pre-commit is a dependency of the python/ project (no root pyproject.toml
# exists), so run these from python/, not the repo root:
#   cd python && uv run pre-commit install --config ../.pre-commit-config.yaml
#   cd python && uv run pre-commit run --config ../.pre-commit-config.yaml --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in lockstep with the ruff version in python/uv.lock: CI runs
    # `uv run ruff` from the lock, this hook runs its own pinned copy, and a
    # drift between them means pre-commit passes locally while CI fails (or
    # the reverse). Dependabot's uv updater only rewrites the lock, so this
    # rev has to be bumped by hand in the same PR.
    rev: v0.16.5
    hooks:
      - id: ruff-check    # lint, autofix what it safely can (`ruff` is a legacy alias)
        args: [--fix]
      - id: ruff-format   # formatting

  - repo: local
    hooks:
      # Run via uv so mypy resolves the project's deps (and their type stubs);
      # config lives in python/pyproject.toml, hence the cd.
      - id: mypy
        name: mypy
        entry: bash -c 'cd python && uv run mypy'
        language: system
        pass_filenames: false
        files: ^python/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
