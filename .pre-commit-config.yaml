# pre-commit is a dependency of the python/ project (no root pyproject.toml
# exists), so run these from python/, not the repo root:
#   cd python && uv run pre-commit install --config ../.pre-commit-config.yaml
#   cd python && uv run pre-commit run --config ../.pre-commit-config.yaml --all-files
repos:
  - repo: local
    hooks:
      # ruff runs from python/uv.lock, the same copy CI lints with, so there is
      # no second version pin to drift (the ruff-pre-commit mirror had one, and
      # Dependabot bumped it in a PR separate from the lock every release).
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd python && uv run ruff check --fix'
        language: system
        pass_filenames: false
        files: ^python/.*\.pyi?$
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd python && uv run ruff format'
        language: system
        pass_filenames: false
        files: ^python/.*\.pyi?$
      # Run via uv so mypy resolves the project's deps (and their type stubs);
      # config lives in python/pyproject.toml, hence the cd.
      - id: mypy
        name: mypy
        entry: bash -c 'cd python && uv run mypy'
        language: system
        pass_filenames: false
        files: ^python/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
