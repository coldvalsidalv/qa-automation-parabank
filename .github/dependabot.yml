version: 2
updates:
  # Python dependencies (pyproject.toml / uv.lock)
  - package-ecosystem: "uv"
    directory: "/python"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  # GitHub Actions versions (the Node 20 -> 24 churn was done by hand once;
  # Dependabot keeps it current from here on)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Docker base image in the test runner Dockerfile
  - package-ecosystem: "docker"
    directory: "/python"
    schedule:
      interval: "weekly"

  # pre-commit hook revisions (.pre-commit-config.yaml lives at the repo root).
  # Only the pre-commit-hooks mirror is pinned here; ruff and mypy run as
  # local hooks from python/uv.lock and are covered by the uv entry above.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      hooks:
        patterns: ["*"]
