version: 2
updates:
  # Python dependencies (pyproject.toml / uv.lock)
  - package-ecosystem: "uv"
    directory: "/python"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  # GitHub Actions versions (the Node 20 -> 24 churn was done by hand once;
  # Dependabot keeps it current from here on)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Docker base image in the test runner Dockerfile
  - package-ecosystem: "docker"
    directory: "/python"
    schedule:
      interval: "weekly"

  # pre-commit hook revisions (.pre-commit-config.yaml lives at the repo root).
  # Without this the ruff hook rev is the one pin nothing updates: the uv
  # updater above rewrites uv.lock only, so the hook silently falls behind the
  # version CI lints with. tests/test_tooling_pins.py fails the build if they
  # ever disagree; this entry is what keeps that from happening in the first
  # place.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      hooks:
        patterns: ["*"]
