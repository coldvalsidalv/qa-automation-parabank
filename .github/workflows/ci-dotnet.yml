name: QA Automation CI (.NET)

on:
  push:
    branches: [main]
    paths: ["dotnet/**", ".github/workflows/ci-dotnet.yml"]
  # No paths filter on pull_request, for symmetry with the Python CI and so the
  # slice is validated on every PR (cheap: ~1-2 min). See ci.yml for the
  # required-status-check rationale.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      filter:
        description: "dotnet test --filter expression"
        default: "Category=smoke"
        required: false

jobs:
  test-dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Dedicated app-under-test instance (see the Python CI for why).
    services:
      parabank:
        image: parasoft/parabank:latest
        ports:
          - 8080:8080

    env:
      BASE_URL: http://localhost:8080

    defaults:
      run:
        working-directory: dotnet/ParabankQa.Tests

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build --configuration Release

      - name: Install Playwright browsers
        run: pwsh bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Wait for ParaBank (initializes its database on first request)
        run: curl -fsL --retry 20 --retry-delay 3 --retry-all-errors -o /dev/null http://localhost:8080/parabank/index.htm

      # No secrets needed: the suite registers a fresh ParaBank customer per run.
      - name: Test
        run: dotnet test --configuration Release --no-build --filter "${{ github.event.inputs.filter || 'Category!=ai_demo' }}"

      - name: Upload Allure results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-dotnet
          path: dotnet/ParabankQa.Tests/bin/Release/net10.0/allure-results/

  publish-report:
    needs: test-dotnet
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the report to the gh-pages branch
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Download Allure results
        uses: actions/download-artifact@v8
        with:
          name: allure-results-dotnet
          path: allure-results/

      - name: Restore report history from gh-pages
        run: |
          if git fetch origin gh-pages --depth 1; then
            git worktree add /tmp/gh-pages FETCH_HEAD
            cp -r /tmp/gh-pages/dotnet/history allure-results/history || true
          fi

      - name: Generate Allure report
        run: npx allure-commandline generate allure-results -o allure-report

      # destination_dir keeps the .NET report under /dotnet; keep_files preserves
      # the Python report at the root and the /ai-demo report.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          destination_dir: dotnet
          keep_files: true
