name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1" # weekly, offset from the test run

jobs:
  analyze:
    # Explicit name so the check context stays "analyze (python)" / "analyze
    # (csharp)" — a matrix would otherwise append build-mode ("analyze (python,
    # none)") and break the required-status-check name in branch protection.
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: csharp
            build-mode: none # buildless analysis — no SDK/restore needed

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4
