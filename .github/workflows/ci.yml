name: QA Automation CI (Python)

on:
  push:
    branches: [main]
    paths: ["python/**", "docs/**", ".github/workflows/ci.yml"]
  # No paths filter on pull_request: `test` is a required status check, so it
  # must report on every PR — a path-filtered required check hangs as "Expected"
  # forever on PRs that don't touch the filtered paths.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      markers:
        description: "pytest -m expression"
        default: "smoke"
        required: false
  schedule:
    - cron: "0 6 * * 1" # weekly run keeps the live Allure report fresh

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Dedicated app-under-test instance: the public demo wipes its database
    # every few minutes, which kills sessions mid-run.
    services:
      parabank:
        # Pinned by digest to match docker-compose.yml — the defect-proof tests
        # assert ParaBank's current behavior exactly, so :latest must not drift.
        image: parasoft/parabank@sha256:747453a0c00b52ed36c7c55aa842a6e9e4a761f70ad577ec07b1f6cbee77e0e5
        ports:
          - 8080:8080

    env:
      BASE_URL: http://localhost:8080

    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy .

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Wait for ParaBank (initializes its database on first request)
        run: curl -fsL --retry 20 --retry-delay 3 --retry-all-errors -o /dev/null http://localhost:8080/parabank/index.htm

      # No secrets needed: the suite registers a fresh ParaBank customer per run.
      # PRs run the fast smoke gate; push to main and the weekly schedule run the
      # full suite ("not ai_demo") so the published Allure report is the whole
      # regression, not a subset. workflow_dispatch honors the markers input.
      - name: Select markers
        id: markers
        run: |
          if [ -n "${{ github.event.inputs.markers }}" ]; then
            echo "expr=${{ github.event.inputs.markers }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "expr=smoke" >> "$GITHUB_OUTPUT"
          else
            echo "expr=not ai_demo" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: uv run pytest -m "${{ steps.markers.outputs.expr }}"

      - name: Upload Allure results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results
          path: python/allure-results/

  publish-report:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the report to the gh-pages branch
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Download Allure results
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results/

      - name: Restore report history from gh-pages
        run: |
          if git fetch origin gh-pages --depth 1; then
            git worktree add /tmp/gh-pages FETCH_HEAD
            cp -r /tmp/gh-pages/history allure-results/history || true
          fi

      - name: Generate Allure report
        run: npx allure-commandline generate allure-results -o allure-report

      # keep_files preserves the /ai-demo report published by ai-demo.yml
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true
