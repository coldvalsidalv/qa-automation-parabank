services:
  # The application under test. A dedicated instance instead of the public
  # demo: parabank.parasoft.com wipes its database every few minutes, which
  # kills sessions mid-run.
  parabank:
    # Pinned by digest, not :latest. The suite's defect-proof tests assert the
    # application's *current buggy* behavior down to the cent (D-09/D-12/D-13/
    # D-19), so a silently republished :latest would turn CI red — or worse,
    # flip a strict xfail to XPASS — with no change on our side.
    # This digest is `latest` as of 2026-09-04; the full suite is green on it.
    image: parasoft/parabank@sha256:747453a0c00b52ed36c7c55aa842a6e9e4a761f70ad577ec07b1f6cbee77e0e5
    ports:
      - "8080:8080"
    healthcheck:
      # -L follows the one-time initializeDB redirect, warming up the database.
      test: ["CMD", "curl", "-fsL", "http://localhost:8080/parabank/index.htm"]
      interval: 5s
      timeout: 10s
      retries: 24

  tests:
    build: ./python
    depends_on:
      parabank:
        condition: service_healthy
    environment:
      BASE_URL: http://parabank:8080
      HEADLESS: "true"
      AI_ANALYSIS: ${AI_ANALYSIS:-false}
      SELF_HEAL: ${SELF_HEAL:-false}
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    volumes:
      - ./python/allure-results:/app/allure-results

  # AI backend for AI_ANALYSIS / SELF_HEAL runs:
  #   docker compose --profile ai up -d ollama
  #   docker compose exec ollama ollama pull llama3.1:8b
  #   AI_ANALYSIS=true SELF_HEAL=true docker compose run --rm tests pytest -m ai_demo
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models:
